<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #4c00ff;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen font-sans">
    <!-- Navbar -->
    <nav
        class="bg-white border-b border-gray-100 px-4 md:px-12 py-4 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50">
        <!-- Left: Logo & Name -->
        <div class="flex items-center gap-2 self-start md:self-auto cursor-pointer" onclick="location.reload()">
            <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-8 h-8">
            <h1 class="font-bold text-xl text-[#24292e] tracking-tight">GitHub Issues Tracker</h1>
        </div>
        <!-- Right: Search & Button -->
        <div class="flex flex-1 md:flex-initial w-full md:w-auto items-center gap-3">
            <div class="relative w-full md:w-60">
                <input type="text" id="searchInput" placeholder="⌕ Search issues..."
                    class="w-full pl-5 pr-4 py-2 bg-white border border-gray-200 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-300 transition-all">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-2.5 text-gray-400"></i>
            </div>
            <button onclick="handleSearch()"
                class="bg-[#4c00ff] hover:bg-[#3f00d6] text-white px-5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                Search
            </button>
        </div>
    </nav>
    <!-- Main-->
    <main class="max-w-[1440px] mx-auto p-4 md:p-8">
        <!-- Tab Section -->
        <div class="flex items-center bg-white border border-gray-200 p-1 rounded-lg w-fit mb-4 shadow-sm">
            <button onclick="changeTab('all')" id="tab-all"
                class="tab-btn px-8 py-2 rounded-md text-sm font-bold bg-[#4c00ff] text-white">All</button>
            <button onclick="changeTab('open')" id="tab-open"
                class="tab-btn px-8 py-2 rounded-md text-sm font-semibold text-gray-500 hover:bg-gray-50">Open</button>
            <button onclick="changeTab('closed')" id="tab-closed"
                class="tab-btn px-8 py-2 rounded-md text-sm font-semibold text-gray-500 hover:bg-gray-50">Closed</button>
        </div>
        <!-- Issue Summary Header -->
        <div
            class="flex flex-col md:flex-row md:items-center justify-between mb-4 gap-4 border border-indigo-80 p-4 md:p-4 rounded-lg">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-4">
                    <!-- Shutter Icon Wrapper -->
                    <div class="p-2 bg-indigo-40 rounded-xl flex items-center justify-center border border-indigo-80">
                        <!-- Replace './assets/shutter.png' with your actual image path -->
                        <img src="./assets/Aperture.png" alt="Shutter Icon" class="w-10 h-10 object-contain">
                    </div>
                    <!-- Issue Count Text -->
                    <div>
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-2xl font-bold text-gray-900 leading-none" id="totalCount">50 Issues</h2>
                        </div>
                        <p class="text-sm text-gray-500 mt-1 font-medium">Track and manage your project issues</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-4 text-xs font-bold uppercase tracking-wider">
                <span class="flex items-center gap-1.5 text-gray-700"><span
                        class="w-2.5 h-2.5 bg-green-500 rounded-full"></span> Open</span>
                <span class="flex items-center gap-1.5 text-gray-700"><span
                        class="w-2.5 h-2.5 bg-purple-600 rounded-full"></span> Closed</span>
            </div>
        </div>
        <!-- Loading Spinner -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-24">
            <!-- Replace the border-based loader with your image -->
            <img src="./assets/Aperture.png" alt="Loading..." class="h-12 w-12 mb-4 animate-spin Purple">
            <p class="text-gray-400 font-medium italic">Synchronizing issues...</p>
        </div>
        <!-- Grid -->
        <div id="issueGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Cards generated by JS -->
        </div>
    </main>
    <!-- Details Modal POPUP-->
    <div id="detailModal"
        class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div
            class="bg-white rounded-xl shadow-2xl max-w-2xl w-full overflow-hidden border border-gray-100 transition-all transform scale-100">
            <div class="p-8">
                <!-- Header: Title & Meta -->
                <h3 id="mTitle" class="text-2xl font-bold text-gray-900 mb-2 leading-tight"></h3>
                <div class="flex items-center gap-2 text-xs text-gray-400 mb-4">
                    <span id="mStatusBadge"
                        class="px-3 py-1 rounded-full font-bold flex items-center gap-1.5 shadow-sm text-white">
                        <!-- Status dot + text injected via JS -->
                    </span>
                    <span>• Opened by <span id="mAuthor" class="font-bold text-gray-600"></span></span>
                    <span>• <span id="mDate"></span></span>
                </div>
                <!-- Labels Row -->
                <div class="flex gap-2 mb-6">
                    <span
                        class="bg-red-50 text-red-500 px-2.5 py-1 rounded border border-red-100 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5">
                        <span class="text-xs">🐞</span> BUG
                    </span>
                    <span
                        class="bg-orange-50 text-orange-500 px-2.5 py-1 rounded border border-orange-100 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5">
                        <span class="text-xs">♻</span> HELP WANTED
                    </span>
                    <span
                        class="bg-orange-50 text-orange-500 px-2.5 py-1 rounded border border-orange-100 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5">
                        <span class="text-xs">🌟 </span> enhancement
                    </span>
                    <span
                        class="bg-orange-50 text-orange-500 px-2.5 py-1 rounded border border-orange-100 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5">
                        <span class="text-xs">🤗</span> good first issued
                    </span>
                    <span
                        class="bg-orange-50 text-orange-500 px-2.5 py-1 rounded border border-orange-100 text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5">
                        <span class="text-xs">📚 </span> documentation
                    </span>
                </div>
                <!-- Description -->
                <p id="mDesc" class="text-gray-500 text-sm mb-10 leading-relaxed font-medium"></p>
                <!-- Info Grid: Assignee & Priority -->
                <div class="bg-[#fcfdfe] border-t border-b border-gray-50 -mx-8 px-8 py-6 grid grid-cols-2 gap-4">
                    <div>
                        <span
                            class="text-gray-400 text-[11px] font-bold uppercase tracking-wider block mb-1">Assignee:</span>
                        <span id="mAssignee" class="font-bold text-gray-900 text-base"></span>
                    </div>
                    <div>
                        <span
                            class="text-gray-400 text-[11px] font-bold uppercase tracking-wider block mb-2">Priority:</span>
                        <span id="mPriorityBadge"
                            class="text-white px-5 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter">
                            <!-- HIGH/MED/LOW injected via JS -->
                        </span>
                    </div>
                </div>
                <!-- Bottom Action: Close Button -->
                <div class="flex justify-end mt-6">
                    <button onclick="closeModal()"
                        class="bg-[#4c00ff] hover:bg-[#3f00d6] text-white px-10 py-2.5 rounded-lg font-bold text-sm transition-all active:scale-95 shadow-lg shadow-indigo-100">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Details Modal POPUP End-->

        let issues = [...mockData];
        let activeFilter = 'all';
        function renderIssues(data) {
            const grid = document.getElementById('issueGrid');
            const loading = document.getElementById('loading');
            grid.innerHTML = '';
            grid.classList.add('hidden');
            loading.classList.remove('hidden');
            setTimeout(() => {
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
                // renderIssues Start
                data.forEach(item => {
                    const isClosed = item.status === 'closed';
                    // 1. Status Icon Logic
                    const statusImg = isClosed ? './assets/Closed-Status.png' : './assets/Open-Status.png';
                    const statusBg = isClosed ? 'bg-purple-50' : 'bg-green-50';
                    // 2. Priority Badge Colors
                    let pBg = '', pText = '';
                    const p = item.priority.toLowerCase();
                    if (p === 'high') { pBg = 'bg-[#fff0f0] border-[#ffe0e0]'; pText = 'text-[#ff5c5c]'; }
                    else if (p === 'medium') { pBg = 'bg-[#fff9e6] border-[#fff2cc]'; pText = 'text-[#f0b400]'; }
                    else { pBg = 'bg-[#f0f2f5] border-[#e1e4e8]'; pText = 'text-[#6a737d]'; }
                    // 3. Dynamic Labels Logic (Handles the Array)
                    const labelsHtml = item.labels.map(label => {
                        const l = label.toLowerCase();
                        let color = 'bg-gray-50 text-gray-500 border-gray-100'; // Default

                        if (l.includes('bug')) color = 'bg-red-50 text-red-500 border-red-100';
                        if (l.includes('enhancement')) color = 'bg-emerald-50 text-emerald-500 border-emerald-100';
                        if (l.includes('documentation')) color = 'bg-blue-50 text-blue-500 border-blue-100';
                        if (l.includes('help wanted')) color = 'bg-orange-50 text-orange-500 border-orange-100';
                        if (l.includes('good first issued')) color = 'bg-indigo-50 text-indigo-500 border-indigo-100';
                        return `<span class="${color} text-[9px] font-black px-2.5 py-1 rounded-full border flex items-center uppercase tracking-wider">${label}</span>`;
                    }).join('');
                    const card = `
        <div onclick="openModal(${item.id})" class="bg-white rounded-xl shadow-sm border-t-4 ${isClosed ? 'border-purple-600' : 'border-green-500'} p-5 hover:shadow-md transition cursor-pointer flex flex-col justify-between group h-full">
            <div>
                <!-- Top Section -->
                <div class="flex items-center justify-between mb-5">
                    <div class="w-8 h-8 flex items-center justify-center rounded-full ${statusBg}">
                        <img src="${statusImg}" alt="status" class="w-5 h-5 object-contain">
                    </div>
                    <div class="px-5 py-1 rounded-full border ${pBg}">
                        <span class="text-[10px] font-black tracking-wider uppercase ${pText}">
                            ${item.priority}
                        </span>
                    </div>
                </div>
                <h4 class="font-bold text-sm text-gray-800 mb-2 group-hover:text-indigo-600 transition">${item.title}</h4>
                <p class="text-[11px] text-gray-400 line-clamp-2 mb-4 leading-relaxed">${item.desc}</p>
                
                <!-- Multi-Labels Section -->
                <div class="flex flex-wrap gap-2 mb-4">
                    ${labelsHtml}
                </div>
            </div>
            <!-- Footer Section -->
            <div class="pt-4 border-t border-gray-100 flex justify-between text-[10px] font-bold text-gray-400 uppercase tracking-tighter leading-tight">
                <div class="flex flex-col gap-1">
                    <span>#${item.id} by ${item.author}</span>
                    <span class="text-gray-400/80 italic font-medium">Assignee: ${item.assignee || 'none'}</span>
                </div>
                <div class="flex flex-col gap-1 text-right items-end">
                    <span>Created: ${item.createdAt}</span>
                    <span class="text-gray-400/80 font-medium">Updated: ${item.updatedAt}</span>
                </div>
            </div>
        </div>
         `;
                grid.insertAdjacentHTML('beforeend', card);
                });
                // renderIssues END
                document.getElementById('totalCount').innerText = `${data.length} Issues`;
                lucide.createIcons();
            }, 600);
        }
        function changeTab(status) {
            activeFilter = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-[#4c00ff]', 'text-white');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${status}`).classList.add('bg-[#4c00ff]', 'text-white');
            document.getElementById(`tab-${status}`).classList.remove('text-gray-500');
            const filtered = status === 'all' ? issues : issues.filter(i => i.status === status);
            renderIssues(filtered);
        }
        // Labels and priority badges.popup start
        function openModal(id) {
            const item = mockData.find(task => task.id === id);
            if (!item) return;
            // 1. DYNAMIC BORDER COLOR (Matching the Image)
            const modalContent = document.querySelector('#detailModal > div'); // Select the white card
            const isOpened = item.status.toLowerCase() === 'open';
            // Reset classes and add the top border thickness
            modalContent.className = "bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden border-t-[6px] transition-all transform scale-100";
            // Apply specific color: Green (#22c55e) or Purple (#a855f7)
            modalContent.classList.add(isOpened ? 'border-[#22c55e]' : 'border-[#a855f7]');
            // 2. Core Content
            document.getElementById('mTitle').textContent = item.title;
            document.getElementById('mDesc').textContent = item.desc;
            document.getElementById('mAuthor').textContent = item.author.toUpperCase();
            document.getElementById('mDate').textContent = item.createdAt;
            document.getElementById('mAssignee').textContent = item.assignee || "NONE";
            // 3. Status Badge (Green/Purple pill inside modal)
            const statusEl = document.getElementById('mStatusBadge');
            statusEl.className = `px-3 py-1 rounded-full font-bold flex items-center gap-1.5 text-white text-[10px] ${isOpened ? 'bg-[#22c55e]' : 'bg-[#a855f7]'}`;
            statusEl.innerHTML = `<span class="w-1.5 h-1.5 bg-white rounded-full"></span> ${item.status.toUpperCase()}`;
            // 4. Labels (Added icons + Exact image colors)
            const labelContainer = document.querySelector('.flex.gap-2.mb-6');
            labelContainer.innerHTML = item.labels.map(label => {
                const text = label.toLowerCase();
                let style = "";
                let icon = "";
                if (text.includes('bug')) {
                    style = "bg-[#fff0f0] text-[#ff5c5c] border-[#ffd6d6]";
                } else if (text.includes('help')) {
                    style = "bg-[#fff4eb] text-[#ff8a35] border-[#ffe0cc]";
                } else if (text.includes('enhancement')) {
                    style = "bg-[#ebfaf2] text-[#00c070] border-[#d1f5e3]";
                } else if (text.includes('first')) {
                    style = "bg-[#f0f2ff] text-[#6366f1] border-[#e0e4ff]";
                } else if (text.includes('doc')) {
                    style = "bg-[#f0f7ff] text-[#0070f3] border-[#d1e9ff]";
                }
                return `<span class="${style} px-2.5 py-1 rounded border text-[10px] font-black uppercase flex items-center gap-1.5">
            <span class="text-[12px]">${icon}</span> ${label}
        </span>`;
            }).join('');
            // 5. Priority Badge (Light background / Solid text)
            const priorityEl = document.getElementById('mPriorityBadge');
            const p = item.priority.toLowerCase();
            let pStyle = "";
            if (p === 'high') {
                pStyle = "bg-[#fff0f0] text-[#ff5c5c]";
            } else if (p === 'medium') {
                pStyle = "bg-[#fff8e6] text-[#ffb800]";
            } else {
                pStyle = "bg-[#f4f6f8] text-[#919eab]";
            }
            priorityEl.className = `${pStyle} px-6 py-1.5 rounded-full text-[11px] font-black uppercase tracking-wider`;
            priorityEl.textContent = item.priority;
            // 6. Display Modal
            document.getElementById('detailModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }
        // END
        // Optional: Close modal when clicking outside the box
        // 1. Modal click remains the same
        document.getElementById('detailModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });
        // 2. Define the search logic in one place
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = issues.filter(i =>
                (activeFilter === 'all' || i.status === activeFilter) &&
                (i.title.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query))
            );
            renderIssues(filtered);
        }
        // 3. Listen for Enter key ONLY (removes automatic sync)
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
        // 4. If you have a physical search button, link it here:
        // document.getElementById('searchButton').addEventListener('click', handleSearch);
        // Initial Load
        renderIssues(issues);
        lucide.createIcons();
        //dynamic global search that filters through every field (ID, Title, Description, Status, Labels, etc.)
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderIssues(activeFilter === 'all' ? issues : issues.filter(i => i.status === activeFilter));
                return;
            }
            const filtered = issues.filter(item => {
                const matchesTab = activeFilter === 'all' || item.status === activeFilter;
                // 1. Check if the query is a number (for ID-only search)
                const isQueryNumber = !isNaN(query) && query !== '';
                if (isQueryNumber) {
                    // STRICT ID MATCH: Only show if ID is exactly the number searched
                    return matchesTab && item.id.toString() === query;
                }
                // 2. BROAD TEXT SEARCH: Search all fields you requested
                const matchesText =
                    item.title.toLowerCase().includes(query) ||
                    item.desc.toLowerCase().includes(query) ||
                    item.status.toLowerCase().includes(query) ||
                    item.priority.toLowerCase().includes(query) ||
                    item.author.toLowerCase().includes(query) ||
                    item.assignee.toLowerCase().includes(query) ||
                    item.createdAt.toLowerCase().includes(query) ||
                    item.updatedAt.toLowerCase().includes(query) ||
                    item.labels.some(l => l.toLowerCase().includes(query));
                return matchesTab && matchesText;
            });
            renderIssues(filtered);
        }
    </script>
</body>
</html>
